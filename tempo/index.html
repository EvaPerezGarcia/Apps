<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<link rel="shortcut icon" type="image/png" href="assets/favicon.png">
<title>Tempo</title>
    

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="auth-screen" class="lg-screen">
  <div class="lg-card">
    <div class="lg-brand">
      <span class="lg-mark"><svg viewBox="0 0 64 64" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lgTile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#286b70"/><stop offset="1" stop-color="#244f55"/></linearGradient>
          <linearGradient id="lgSweep" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#54b8aa"/><stop offset="1" stop-color="#a4e0d3"/></linearGradient>
        </defs>
        <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lgTile)" stroke="#e9fffb" stroke-opacity=".82" stroke-width="1.8"/>
        <path d="M3.5 47.5c11 4.2 21.5 1.2 31.2-5.1 9.4-6.1 17.4-7.4 27.8-4.5v8.7c-8.2 9.6-19.1 14-32.4 14H18.5C10.1 60.6 4.7 56.1 3.5 47.5Z" fill="url(#lgSweep)"/>
        <path d="M7 49c11.2 3.3 20.6.1 29.7-5.7 8.3-5.3 16.2-6.7 23.5-4.9" fill="none" stroke="#d9fff6" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>
        <g fill="none" stroke="#f5fffc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="17" cy="18" r="5.1"/><path d="m14.5 18 1.7 1.8 3.4-4"/><path d="M28 18h20" stroke-width="4"/>
          <circle cx="17" cy="31" r="5.1"/><path d="m14.5 31 1.7 1.8 3.4-4"/><path d="M28 31h16" stroke-width="4"/>
          <circle cx="17" cy="44" r="5.1"/><path d="M28 44h17" stroke-width="4"/>
        </g>
        <circle cx="55.5" cy="43.5" r="3.2" fill="#c9f5e9" stroke="#277b76" stroke-width="1"/>
      </svg></span>
      <span class="lg-name">Tempo<span style="color:#9fd5ce">.</span></span>
    </div>
    <h1>Inicia sesión</h1>
    <p class="lg-sub">Accede a tu espacio para ver tus tareas y tu calendario.</p>
    <form id="auth-form" class="lg-form" novalidate>
      <label class="lg-label" for="auth-email">Correo electrónico</label>
      <input class="lg-input" id="auth-email" name="email" type="email" required autocomplete="username" placeholder="tu@correo.com">
      <label class="lg-label" for="auth-password">Contraseña</label>
      <div class="lg-pw">
        <input class="lg-input" id="auth-password" name="password" type="password" required minlength="6" autocomplete="current-password" placeholder="Mínimo 6 caracteres">
        <button type="button" class="lg-eye" id="lg-eye" aria-label="Mostrar contraseña">Mostrar</button>
      </div>
      <button type="button" class="lg-forgot" id="auth-forgot">¿Olvidaste tu contraseña?</button>
      <button type="submit" id="auth-submit" class="lg-primary">Iniciar sesión</button>
    </form>
    <div class="lg-divider"><span>¿Aún no tienes cuenta?</span></div>
    <button type="button" class="lg-secondary" id="auth-signup">Crear una cuenta</button>
    <div id="auth-msg" class="lg-msg" role="status"></div>
    <p class="lg-foot">Tus tareas se sincronizan de forma segura con tu cuenta.</p>
  </div>
</div>
<div class="app">
  <aside>
    <div class="logo">
      <svg class="tempo-mark" viewBox="0 0 64 64" role="img" aria-label="Icono de Tempo" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="tempoTileSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#286b70"/><stop offset="1" stop-color="#244f55"/></linearGradient>
        <linearGradient id="tempoSweepSide" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#54b8aa"/><stop offset="1" stop-color="#a4e0d3"/></linearGradient>
      </defs>
      <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tempoTileSide)" stroke="#e9fffb" stroke-opacity=".82" stroke-width="1.8"/>
      <path d="M3.5 47.5c11 4.2 21.5 1.2 31.2-5.1 9.4-6.1 17.4-7.4 27.8-4.5v8.7c-8.2 9.6-19.1 14-32.4 14H18.5C10.1 60.6 4.7 56.1 3.5 47.5Z" fill="url(#tempoSweepSide)"/>
      <path d="M7 49c11.2 3.3 20.6.1 29.7-5.7 8.3-5.3 16.2-6.7 23.5-4.9" fill="none" stroke="#d9fff6" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>
      <g fill="none" stroke="#f5fffc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="17" cy="18" r="5.1"/><path d="m14.5 18 1.7 1.8 3.4-4"/>
        <path d="M28 18h20" stroke-width="4"/>
        <circle cx="17" cy="31" r="5.1"/><path d="m14.5 31 1.7 1.8 3.4-4"/>
        <path d="M28 31h16" stroke-width="4"/>
        <circle cx="17" cy="44" r="5.1"/><path d="M28 44h17" stroke-width="4"/>
      </g>
      <circle cx="55.5" cy="43.5" r="3.2" fill="#c9f5e9" stroke="#277b76" stroke-width="1"/>
    </svg><span class="brand-name">Tempo<span class="brand-dot">.</span></span>
    </div>
    <button class="nav" data-act="go" data-view="home" id="n-home"></button>
    <button class="nav" data-act="go" data-view="calendar" id="n-cal"></button>
    <button class="nav" data-act="go" data-view="tasks" id="n-tasks"></button>
    <button class="nav" data-act="go" data-view="stats" id="n-stats"></button>
    <button class="nav" data-act="focus" id="n-focus"></button>
    <div class="me"><div class="avatar" id="user-avatar">T</div><div class="me-info"><strong id="user-email">Cuenta</strong><small>Espacio personal</small></div><button class="logout-btn" type="button" data-act="logout" title="Cerrar sesión" aria-label="Cerrar sesión"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M21 3v18"/></svg><span>Cerrar sesión</span></button></div>
  </aside>
  <main id="main"></main>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
