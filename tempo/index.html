<title>Tempo</title>
    

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --white:#ffffff;--ink:#111827;--ink2:#374151;--mute:#6b7280;--faint:#9ca3af;
  --line:#e5e7eb;--hover:#f6f7f9;
  --petrol:#1e5f66;--petrol-d:#174b51;--petrol-s:#e8f1f2;
  --red:#b42318;--red-s:#fef3f2;--amber:#92400e;--amber-s:#fef7e6;
  --blue-s:#eaf0f8;--blue:#2d4a6e;--green-s:#e9f5ee;--green:#2f6f4f;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--white);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg{display:block}

.app{display:none;grid-template-columns:232px 1fr;height:100%}

/* Sidebar */
aside{background:var(--petrol);color:#d7e7e8;padding:22px 14px;display:flex;flex-direction:column;gap:2px;overflow:auto;padding-top:calc(22px + env(safe-area-inset-top,0px))}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:20px;letter-spacing:-.03em;padding:4px 10px 26px}
.logo .tempo-mark{width:38px;height:38px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.16))}
.brand-name{color:#ffffff;font-weight:700;font-size:20px;letter-spacing:-.03em;line-height:1}.brand-dot{color:#9fd5ce;margin-left:1px;text-shadow:0 0 7px rgba(159,213,206,.45)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:#d7e7e8;width:100%;text-align:left;font-weight:500}
.nav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;opacity:.85}
.nav:hover{background:rgba(255,255,255,.08);color:#fff}
.nav.on{background:rgba(255,255,255,.16);color:#fff}
.nav .count{margin-left:auto;font-size:12px;color:#a9cbcd;font-weight:500}
.side-h{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#8fb9bb;font-weight:600;padding:0 10px;margin:28px 0 8px}
.tg{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;width:100%;text-align:left;color:#d7e7e8}
.tg:hover{background:rgba(255,255,255,.08);color:#fff}
.tg .count{margin-left:auto;font-size:12px;color:#a9cbcd}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid rgba(255,255,255,.12);color:#fff;font-weight:500}
.me small{display:block;color:#a9cbcd;font-size:12px;font-weight:400}
.avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}

/* Main */
main{padding:30px 40px 80px;overflow:auto;min-width:0;max-width:1120px;width:100%}
.page-h{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:22px;font-weight:650;margin:0;letter-spacing:-.02em}
.sub{color:var(--mute);margin-top:3px}
.muted{color:var(--mute)}
.red{color:var(--red)}

.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;font-weight:500;font-size:14px;border:1px solid transparent;white-space:nowrap;transition:background .12s,border-color .12s}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--petrol);color:#fff}
.btn.primary:hover{background:var(--petrol-d)}
.btn.secondary{background:#fff;border-color:var(--line);color:var(--ink2)}
.btn.secondary:hover{background:var(--hover);border-color:#d1d5db}
.btn.ghost{color:var(--ink2)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red-s)}
.btn.icon{width:36px;padding:0;justify-content:center}
.link{color:var(--petrol);font-weight:500;font-size:13px;padding:4px 6px;border-radius:6px}
.link:hover{background:var(--petrol-s)}

/* Stats */
.page-h.band{background:#dcecee;margin:-30px -40px 28px;padding:30px 40px 26px;border-bottom:1px solid #c5dcdf}
.page-h.band h1{color:#174b51}
.page-h.band .sub{color:#4d7478}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;margin-bottom:28px;background:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(17,24,39,.04),0 6px 16px -6px rgba(17,24,39,.12)}
.stat{padding:16px 18px;border-top:3px solid var(--petrol)}
.stat+.stat{border-left:1px solid var(--line)}
.stat .l{font-size:13px;color:var(--mute)}
.stat .sh{display:flex;align-items:center;gap:9px}
.sico{width:30px;height:30px;border-radius:8px;background:var(--petrol-s);color:var(--petrol);display:grid;place-items:center;flex:none}
.sico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat .v{font-size:30px;font-weight:650;letter-spacing:-.02em;margin-top:12px;line-height:1}
.stat .cap{font-size:12.5px;color:var(--mute);margin-top:9px}
.pbar{height:6px;background:var(--hover);border-radius:99px;overflow:hidden;margin-top:12px}
.pbar div{height:100%;background:var(--petrol);border-radius:99px}
.stat .v.red{color:var(--red)}

/* Sections */
.sec{margin-bottom:28px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sec-h h2{font-size:15px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.sec-h h2 span{font-size:12px;color:var(--mute);background:var(--hover);border:1px solid var(--line);border-radius:99px;padding:0 8px;font-weight:500}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(17,24,39,.04),0 6px 16px -6px rgba(17,24,39,.12)}
.item{display:flex;align-items:center;gap:14px;padding:12px 14px;background:#fff}
.item+.item{border-top:1px solid var(--line)}
.item:hover{background:var(--hover)}
.item:hover .acts{opacity:1}
.item-main{flex:1;min-width:0;cursor:pointer}
.item-t{font-weight:500;overflow-wrap:anywhere}
.item.done .item-t{text-decoration:line-through;color:var(--mute)}
.item.done{opacity:.65}
.item-m{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:2px}
.item-m span{display:inline-flex;align-items:center;gap:6px}
.acts{display:flex;gap:2px;opacity:.55;transition:opacity .12s;flex:none}
@media (hover:none){.acts{opacity:1}}
.ibtn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--mute)}
.ibtn:hover{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.ibtn.del:hover{color:var(--red)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chk{width:18px;height:18px;border:1.5px solid #c4cad3;border-radius:5px;flex:none;display:grid;place-items:center;background:#fff}
.chk:hover{border-color:var(--petrol)}
.chk.on{background:var(--petrol);border-color:var(--petrol)}
.chk svg{width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:1px 8px;border-radius:99px;background:var(--hover);color:var(--ink2)}
.badge.red{background:var(--red-s);color:var(--red)}
.badge.amber{background:var(--amber-s);color:var(--amber)}
.badge.blue{background:var(--blue-s);color:var(--blue)}
.badge.green{background:var(--green-s);color:var(--green)}
.empty{padding:28px 16px;text-align:center;color:var(--mute);border:1px dashed #d1d5db;border-radius:10px}

/* Calendar */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tb-l{display:flex;align-items:center;gap:8px}
.tb-l h2{font-size:18px;font-weight:600;margin:0 8px;text-transform:capitalize;letter-spacing:-.01em}
.iconbox{width:32px;height:32px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;background:#fff;color:var(--ink2)}
.iconbox:hover{background:var(--hover)}
.iconbox svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;background:var(--hover);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 14px;border-radius:6px;color:var(--mute);font-weight:500;font-size:13px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.cal{min-width:780px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dh{padding:9px 10px;font-size:12px;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line);background:var(--hover);text-transform:uppercase;letter-spacing:.04em}
.cell{min-height:120px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell.out{background:#fbfbfc}
.cell.out .n{color:var(--faint)}
.cell .n{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);font-weight:500;padding:0 2px;margin-bottom:2px}
.cell .n .add{opacity:0;color:var(--mute);font-size:16px;line-height:1;padding:2px 5px;border-radius:5px;transition:opacity .12s}
.cell:hover .n .add,.wc:hover .add{opacity:1}
.cell .n .add:hover{background:var(--hover);color:var(--petrol)}
.cell.today .n b{background:var(--petrol);color:#fff;border-radius:99px;min-width:24px;height:24px;padding:0 6px;display:inline-grid;place-items:center;font-weight:600}
.ev{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 8px;border-radius:6px;cursor:pointer;min-width:0;background:var(--c);color:#fff;font-weight:500}
.ev:hover{filter:brightness(1.08)}
.ev i{display:none}
.ev span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev em{font-style:normal;color:rgba(255,255,255,.85);flex:none;font-size:11.5px;font-weight:600}
.ev.done{opacity:.5}
.ev.done span{text-decoration:line-through}
.ev.late{box-shadow:inset 3px 0 0 #7f1d1d}
.ev.wrap span{white-space:normal;overflow-wrap:anywhere}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:900px}
.wc{border-right:1px solid var(--line);padding:10px 8px;min-height:500px;display:flex;flex-direction:column;gap:6px;background:#fff}
.wc:last-child{border-right:0}
.wc.today{background:#f5faf9}
.wh{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.wh span{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.wh b{font-size:16px;font-weight:600}
.wc.today .wh b{background:var(--petrol);color:#fff;border-radius:99px;padding:0 8px;line-height:24px}
.wc .add{opacity:1;color:var(--mute);font-size:13px;padding:6px;border-radius:6px;text-align:left;margin-top:auto}
.wc .add:hover{background:var(--hover);color:var(--petrol)}

/* Tasks */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{padding:10px 12px;color:var(--mute);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--petrol);border-color:var(--petrol)}
.tabs small{font-size:12px;background:var(--hover);border-radius:99px;padding:0 7px;margin-left:6px;color:var(--mute);font-weight:500}
.tabs button.on small{background:var(--petrol-s);color:var(--petrol)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;min-width:240px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2}
input[type=search],select,input[type=date],input[type=time],input[type=text],textarea{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:0 12px;height:40px;outline:none;font-size:14px;color:var(--ink)}
textarea{padding:8px 12px;height:auto}
.search input{padding-left:34px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--petrol);box-shadow:0 0 0 3px var(--petrol-s)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:30px;padding:0 11px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--ink2);font-weight:500;background:#fff}
.chips button:hover{border-color:#cbd1d9}
.chips button.on{background:var(--petrol-s);border-color:#bcd7da;color:var(--petrol)}
.table{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:10px 14px;background:var(--hover);border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbfc}
tr.done td.t-main .t{text-decoration:line-through;color:var(--mute)}
td.t-main{cursor:pointer}
td.right{text-align:right;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-size:12.5px;font-weight:500;border:0;background:var(--hover);color:var(--ink2)}
.pill:hover{filter:brightness(.97)}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.4);display:none;place-items:center;z-index:30;padding:16px}
.ov.open{display:grid;align-items:start;padding-top:7vh}
.modal{background:#fff;border-radius:14px;border:1px solid var(--line);width:560px;max-width:100%;padding:28px 28px 22px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px -12px rgba(17,24,39,.28)}
.modal h2{font-size:20px;font-weight:650;margin:0 0 2px;letter-spacing:-.02em}
.modal .sub{margin-bottom:20px;font-size:13.5px}
.f{margin-top:18px}
.f input[type=text]{font-size:15px;height:42px}
.f label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:7px;letter-spacing:.01em}
.f input,.f textarea{width:100%}
.f textarea{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{height:34px;padding:0 13px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--ink2);font-weight:500;display:inline-flex;align-items:center;gap:8px;background:#fff}
.opts button:hover{border-color:#cbd1d9}
.opts button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.opts.nodot button::before{display:none}
.opts button.on{border-color:var(--petrol);background:var(--petrol-s);color:var(--petrol-d);font-weight:600;box-shadow:inset 0 0 0 1px var(--petrol)}
.mf{display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);gap:8px}
.mf .l{display:flex;gap:8px}

.modal{width:640px;padding:0;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 28px 16px;border-bottom:1px solid var(--line)}
.m-body{overflow:auto;padding:4px 28px;flex:1}
.m-sec{padding:18px 0;border-bottom:1px solid var(--line)}
.m-sec:last-child{border-bottom:0}
.m-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:600;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.m-count{background:var(--hover);border-radius:99px;padding:0 8px;text-transform:none;letter-spacing:0;font-weight:500}
.input-lg{width:100%;height:44px;font-size:16px;font-weight:500;border:1px solid #d1d5db;border-radius:10px;padding:0 14px;margin-bottom:10px;outline:none;background:#fff}
.m-sec textarea{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px 14px;resize:vertical;font:inherit;outline:none}
.input-lg:focus,.m-sec textarea:focus,.sel:focus,.g3 input:focus,.sub-add input:focus{border-color:var(--petrol);box-shadow:0 0 0 3px var(--petrol-s)}
.g3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
.g3 label,.g2 label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:7px}
.g3 input,.sel{width:100%;height:40px;border:1px solid #d1d5db;border-radius:8px;padding:0 10px;background:#fff;font:inherit;color:var(--ink);outline:none}
.field-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.field-row>span{width:84px;font-size:13px;color:var(--ink2);font-weight:500;flex:none}
.field-row .opts{flex:1}
.sub-row{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.sub-row span{flex:1}
.sub-row.done span{text-decoration:line-through;color:var(--mute)}
.sub-add{display:flex;gap:8px;margin-top:12px}
.sub-add input{flex:1;height:38px;border:1px solid #d1d5db;border-radius:8px;padding:0 12px;font:inherit;outline:none}
.m-foot{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-top:1px solid var(--line);background:#fbfbfc}
.m-foot .l{display:flex;gap:8px}
.srch-box{width:560px;padding:16px;max-height:80vh}
.srch-box input{width:100%;height:44px;font-size:15px;border:1px solid #d1d5db;border-radius:10px;padding:0 14px;outline:none}
.srch-box input:focus{border-color:var(--petrol);box-shadow:0 0 0 3px var(--petrol-s)}
#srch-res{margin-top:10px;max-height:52vh;overflow:auto}
.srch-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:8px;text-align:left;color:var(--ink)}
.srch-item:hover{background:var(--hover)}
.srch-item svg{width:15px;height:15px;stroke:var(--mute);fill:none;stroke-width:2}
.srch-item small{margin-left:auto;color:var(--mute);font-size:12px}
.srch-tip{font-size:12px;color:var(--mute);margin-top:10px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bcol{background:var(--hover);border-radius:10px;padding:12px;min-height:300px;display:flex;flex-direction:column;gap:8px}
.bh{display:flex;justify-content:space-between;font-weight:600;font-size:13px;padding:2px 4px 8px}
.bh b{color:var(--mute);font-weight:500}
.bcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 12px;cursor:grab;box-shadow:0 1px 2px rgba(17,24,39,.05)}
.bcard:hover{border-color:#cbd1d9}
.bt{font-weight:500;margin-bottom:4px}
.day-view{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.day-untimed{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--hover)}
.hour-row{display:flex;border-bottom:1px solid var(--line);min-height:52px}
.hour-row:last-child{border-bottom:0}
.hour-lbl{width:72px;flex:none;padding:8px 12px;font-size:12px;color:var(--mute);border-right:1px solid var(--line)}
.hour-body{flex:1;padding:6px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.hour-body .ev{white-space:normal}
@media (max-width:820px){.board{grid-template-columns:1fr}}
.hist-row{display:flex;gap:12px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.hist-row span{color:var(--mute);width:84px;flex:none;font-variant-numeric:tabular-nums}
.focus-box{width:440px;padding:26px 28px;text-align:center}
.focus-box .m-head{padding:0 0 4px;border:0;text-align:left}
.focus-time{font-size:64px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:18px 0 4px}
.focus-task{color:var(--mute);margin-bottom:6px;min-height:20px}
.focus-box .f{text-align:left}
.focus-actions{display:flex;gap:8px;justify-content:center;margin-top:18px}
.wchart{display:flex;gap:12px;align-items:flex-end;border:1px solid var(--line);border-radius:10px;padding:18px 16px 12px;background:#fff}
.wcol2{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.wcol2 b{font-weight:600;font-size:13px}
.wtrack{height:150px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.wfill{width:70%;max-width:44px;background:var(--petrol);border-radius:6px 6px 0 0;min-height:3px}
.wcol2 span{font-size:12px;color:var(--mute);white-space:nowrap}
.trows .trow{display:grid;grid-template-columns:1fr 130px 170px;gap:12px;padding:14px;border-bottom:1px solid var(--line);font-size:14px}
.trows .trow:last-child{border-bottom:0}
.trows .trow span:not(:first-child){color:var(--mute)}
.trows .trow>span:first-child{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:600}
.trows .trow .dot{margin:0}
.tabs{display:inline-flex;gap:2px;background:var(--hover);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{border-bottom:0;margin:0;padding:7px 13px;border-radius:7px;font-size:13.5px;color:var(--mute);display:inline-flex;align-items:center;gap:4px;transition:background .12s,color .12s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(17,24,39,.12)}
.tabs button.on small{background:var(--petrol-s);color:var(--petrol)}
.tabs small{font-size:11.5px;background:transparent;margin-left:4px;padding:0 6px;border-radius:99px;border:1px solid var(--line);color:var(--mute);font-weight:600}
.tools{gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(17,24,39,.04);margin-bottom:18px}
.search input{height:46px;border-radius:10px;background:#fff;border-color:#d3e9e4;font-size:15px}
.search input:focus{background:#fff;border-color:var(--petrol)}
.chips{background:var(--hover);padding:3px;border-radius:10px;gap:2px}
.chips button{height:36px;border:0;background:transparent;padding:0 14px;border-radius:7px;font-size:14px}
.chips button:hover{background:rgba(255,255,255,.7)}
.chips button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(17,24,39,.12);border:0}
.tools select{height:46px;border-radius:10px;background:#fff;border:1px solid #e3e8ea;padding:0 30px 0 12px;font-size:14px;color:var(--ink2)}
.table{border-radius:12px;box-shadow:0 1px 2px rgba(17,24,39,.04),0 8px 20px -12px rgba(17,24,39,.15)}
th{background:#f8fafb;font-size:13.5px;letter-spacing:.02em;padding:14px 16px;color:var(--ink2);font-weight:600}
td{padding:13px 16px}
tbody tr{transition:background .12s}

.bcol{background:#f3f6f7;border:1px solid #e6ecee}

.table td.t-main .row-title{font-weight:600}
.bcard .item-m{font-size:12.5px}
.bcol{background:#f5f7f8;border-color:#e9eef0}
.tools{background:#f8fafb;border:1px solid #e8ecef;box-shadow:none;padding:18px 20px;border-radius:12px}
.tools .seg button{padding:9px 16px;font-size:14px}
.tools .chips{background:#fff}
.prio svg{width:15px;height:15px;stroke:#111827;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tagc{display:inline-flex;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:13.5px;text-decoration:none}
.prio{display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:13px;color:var(--ink2)}

.dur-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}

.dur-custom{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px}

.dur-custom input:focus{border-color:var(--petrol);box-shadow:0 0 0 3px var(--petrol-s)}
.home-cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;align-items:start}

const iso = d => { const z=new Date(d); z.setMinutes(z.getMinutes()-z.getTimezoneOffset()); return z.toISOString().slice(0,10); };
const addDays = (d,n) => { const z=new Date(d); z.setDate(z.getDate()+n); return z; };

const relDay = s => { const n=daysBetween(s); return n===0?'Hoy':n===1?'Mañana':n===-1?'Ayer':pd(s).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}).replace('.',''); };

const SUPABASE_URL = 'https://irpphxcbrwatfyztwgle.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CU1estT9eb4gjEZWfGIlbA_cGnB83ZA';
let supabase = null;
// Cliente REST propio: evita depender de cargar una biblioteca externa (CDN).
function createRestClient(url, key){
  const storageKey='tempo-supabase-session';
  let session=null, authListener=null;
  try{ session=JSON.parse(localStorage.getItem(storageKey)||'null'); }catch{}
  const saveSession=s=>{ session=s; if(s) localStorage.setItem(storageKey,JSON.stringify(s)); else localStorage.removeItem(storageKey); };
  const emit=(event,s)=>{ if(authListener) authListener(event,s); };
  async function request(path, options={}){
    const headers={apikey:key,'Content-Type':'application/json',...(options.headers||{})};
    if(session?.access_token) headers.Authorization='Bearer '+session.access_token;
    const response=await fetch(url+path,{...options,headers});
    const raw=await response.text(); let data=null; try{data=raw?JSON.parse(raw):null;}catch{data=raw;}
    if(!response.ok) throw new Error(data?.msg||data?.message||data?.error_description||data?.error||('Error HTTP '+response.status));
    return data;
  }
  async function ensureFresh(){
    if(!session?.refresh_token) return;
    if(session.expires_at && Date.now()/1000 < session.expires_at-60) return;
    const response=await fetch(url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok){saveSession(null);emit('SIGNED_OUT',null);return;}
    saveSession({...data,expires_at:Math.floor(Date.now()/1000)+(data.expires_in||3600)});
    emit('TOKEN_REFRESHED',session);
  }
  const auth={
    async signUp({email,password}){
      try{
        const data=await request('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});
        if(data.access_token){saveSession({...data,expires_at:Math.floor(Date.now()/1000)+(data.expires_in||3600)});emit('SIGNED_IN',session);}
        return {data:{user:data.user||null,session:data.access_token?session:null},error:null};
      }catch(error){return {data:{user:null,session:null},error};}
    },
    async resetPasswordForEmail(email){ try{ await request('/auth/v1/recover',{method:'POST',body:JSON.stringify({email})}); return {error:null}; }catch(error){ return {error}; } },
    async signInWithPassword({email,password}){
      try{
        const data=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
        saveSession({...data,expires_at:Math.floor(Date.now()/1000)+(data.expires_in||3600)}); emit('SIGNED_IN',session);
        return {data:{user:data.user,session},error:null};
      }catch(error){return {data:{user:null,session:null},error};}
    },
    async getSession(){try{await ensureFresh();return {data:{session},error:null};}catch(error){return {data:{session:null},error};}},
    onAuthStateChange(_event,callback){authListener=callback;return {data:{subscription:{unsubscribe(){authListener=null;}}}};},
    async signOut(){saveSession(null);emit('SIGNED_OUT',null);return {error:null};}
  };
  function from(table){
    let method='GET', body=null, filters=[], ordering=null, selected='*', prefer='';
    const builder={
      select(columns='*'){selected=columns; if(method==='GET') method='GET'; else prefer=prefer?prefer+',return=representation':'return=representation'; return builder;},
      order(column,{ascending=true}={}){ordering=column+'.'+(ascending?'asc':'desc');return builder;},
      upsert(value){method='POST';body=value;prefer='resolution=merge-duplicates,return=minimal';return builder;},
      insert(value){method='POST';body=value;prefer='return=minimal';return builder;},

/* ---- Cifrado de extremo a extremo: Web Crypto API ----
   La clave solo vive en memoria mientras la cuenta está desbloqueada.
   La contraseña no se almacena ni se envía a las tablas de datos.
*/
let tempoCryptoKey = null;
let tempoCryptoSalt = null;
const TEMPO_KDF_ITERATIONS = 600000;
const TEMPO_CRYPTO_VERSION = 1;
const bytesToB64 = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)));
const b64ToBytes = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));

async function deriveTempoKey(password, saltB64){
  const material = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64ToBytes(saltB64), iterations:TEMPO_KDF_ITERATIONS, hash:'SHA-256'},
    material, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
async function encryptTempoPayload(payload){
  if(!tempoCryptoKey) throw new Error('La cuenta está bloqueada.');
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const plain=new TextEncoder().encode(JSON.stringify(payload));
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},tempoCryptoKey,plain);
  return {ciphertext:bytesToB64(cipher),iv:bytesToB64(iv)};
}
async function decryptTempoPayload(row){
  if(!tempoCryptoKey) throw new Error('La cuenta está bloqueada.');
  const plain=await crypto.subtle.decrypt(
    {name:'AES-GCM',iv:b64ToBytes(row.iv)},tempoCryptoKey,b64ToBytes(row.ciphertext)
  );
  return JSON.parse(new TextDecoder().decode(plain));
}
async function putEncryptedRecord(type, id, payload){
  const encrypted=await encryptTempoPayload(payload);
  const row={id,user_id:currentUser.id,record_type:type,ciphertext:encrypted.ciphertext,iv:encrypted.iv,crypto_version:TEMPO_CRYPTO_VERSION};
  const {error}=await supabase.from('encrypted_records').upsert(row);
  if(error) throw error;
  return true;
}
async function deleteEncryptedRecord(type,id){
  const {error}=await supabase.from('encrypted_records').delete().eq('id',id).eq('record_type',type);
  if(error) throw error;
  return true;
}

async function initialiseOrUnlockCrypto(password){
  if(!window.isSecureContext || !window.crypto?.subtle) throw new Error('El cifrado requiere HTTPS o localhost y un navegador compatible.');
  const metaResult=await supabase.from('crypto_meta').select('*').eq('user_id',currentUser.id);
  if(metaResult.error) throw new Error('No se pudo consultar crypto_meta. Ejecuta primero el SQL de configuración.');
  let meta=(metaResult.data||[])[0];
  if(!meta){
    const salt=crypto.getRandomValues(new Uint8Array(16));
    meta={user_id:currentUser.id,salt:bytesToB64(salt),kdf_iterations:TEMPO_KDF_ITERATIONS,crypto_version:TEMPO_CRYPTO_VERSION};
    const saved=await supabase.from('crypto_meta').upsert(meta);
    if(saved.error) throw new Error('No se pudo inicializar el cifrado: '+saved.error.message);
  }
  tempoCryptoSalt=meta.salt;
  tempoCryptoKey=await deriveTempoKey(password,meta.salt);
  // Verifica la contraseña/clave antes de continuar. Si ya hay registros cifrados,
  // el primero debe poder descifrarse; si no, se usará la migración inicial.
  const encrypted=await supabase.from('encrypted_records').select('*').eq('user_id',currentUser.id);
  if(encrypted.error) throw new Error('No se pudo acceder a encrypted_records. Ejecuta primero el SQL de configuración.');
  if((encrypted.data||[]).length){
    try{ await decryptTempoPayload(encrypted.data[0]); }
    catch{ lockTempo(); throw new Error('La contraseña no permite descifrar los datos de esta cuenta. Si has restablecido la contraseña, los datos antiguos no se pueden recuperar.'); }
  }
  // Las tablas antiguas ya se eliminaron tras completar la migración.
  // A partir de aquí se trabaja exclusivamente con encrypted_records.
}

async function fetchEncryptedRecords(){
  const {data,error}=await supabase.from('encrypted_records').select('*').eq('user_id',currentUser.id);
  if(error) throw error;
  const decoded={task:[],focus:[],note:[],category:[]};
  for(const row of data||[]){
    if(!decoded[row.record_type]) continue;
    decoded[row.record_type].push({id:row.id,payload:await decryptTempoPayload(row)});
  }
  return decoded;
}

async function signInOrSignUp(mode){
  if(!supabase){authMessage('La conexión todavía no está lista. Espera unos segundos y vuelve a intentarlo.',true);return;}
  if(authBusy) return;
  const btn=$('#auth-submit'), email=$('#auth-email').value.trim(), password=$('#auth-password').value;
  // El botón Crear cuenta está fuera del formulario; validar aquí expresamente.
  if(!email){authMessage('Introduce tu correo electrónico.',true);$('#auth-email').focus();return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){authMessage('Introduce un correo electrónico válido.',true);$('#auth-email').focus();return;}
  if(!password){authMessage('Introduce una contraseña.',true);$('#auth-password').focus();return;}
  if(password.length<6){authMessage('La contraseña debe tener al menos 6 caracteres.',true);$('#auth-password').focus();return;}
  authBusy=true;
  btn.disabled=true; btn.textContent='Conectando…';
  try{
    const result=mode==='signup'
      ? await supabase.auth.signUp({email,password})
      : await supabase.auth.signInWithPassword({email,password});
    if(result.error) throw result.error;
    if(mode==='signup'&&!result.data.session){authMessage('Cuenta creada. Revisa tu correo para confirmar el registro.');}
    else if(result.data.user){currentUser=result.data.user;await loadUserData(password);}
  }catch(err){authMessage(err.message||'No se pudo iniciar sesión.',true);}
  finally{authBusy=false;btn.disabled=false;btn.textContent='Iniciar sesión';}
}

function monthGrid(){
  const a=state.anchor, first=new Date(a.getFullYear(),a.getMonth(),1);
  const offset=(first.getDay()+6)%7;
  const dim=new Date(a.getFullYear(),a.getMonth()+1,0).getDate();
  const rows=Math.ceil((offset+dim)/7);
  let cells='';
  for(let i=0;i<rows*7;i++){
    const dayNum=i-offset+1;
    if(dayNum<1||dayNum>dim){ cells+='<div class="cell empty"></div>'; continue; }
    const d=new Date(a.getFullYear(),a.getMonth(),dayNum), key=iso(d), list=tasksOn(key);
    cells+=`<div class="cell ${key===t0?'today':''}" data-day="${key}">
      <div class="n"><b>${dayNum}</b><button class="add" data-act="new-day" data-day="${key}" title="Añadir tarea">+</button></div>
      ${list.slice(0,3).map(pill).join('')}${list.length>3?`<button class="more-btn" data-act="more-day" data-day="${key}">+${list.length-3} más</button>`:''}
    </div>`;
  }
  const heads=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="dh">${d}</div>`).join('');
  return `<div class="scroll"><div class="cal"><div class="cal-grid">${heads}${cells}</div></div></div>`;
}

function weekView(){
  const ws=weekStart(state.anchor);

  for(let i=0;i<7;i++){
    const d=addDays(ws,i), key=iso(d), list=tasksOn(key);
    cols+=`<div class="wc ${key===t0?'today':''}" data-day="${key}">

function saveTask(){
  readForm();

  if(state.editing){ const old=state.tasks.find(t=>t.id===state.editing); if(old.due_date!==data.due_date) logChange(old,'Fecha: '+data.due_date); if(old.status!==data.status) logChange(old,'Estado: '+ST[data.status][0]); old.doneAt=data.status==='hecha'?(old.doneAt||t0):null; Object.assign(old, data); toast('Cambios guardados'); }
  else { const n={id:crypto.randomUUID(), ...data, history:[]}; logChange(n,'Creada'); if(n.status==='hecha') n.doneAt=t0; state.tasks.push(n); persistTask(n); toast('Tarea añadida'); }

}

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  const task=()=>state.tasks.find(t=>t.id===id);
  switch(act){
    case 'logout': signOutTempo(); break;
    case 'note-add': addGeneralNote(); break;
    case 'note-edit': editGeneralNote(id); break;
    case 'note-save': saveNoteFromEditor(); break;
    case 'note-cancel': state.noteEditorOpen=false; state.noteEditingId=null; render(); break;
    case 'note-cycle': cycleGeneralNote(id); break;
    case 'note-delete': deleteGeneralNote(id); break;
    case 'go':
      state.view=el.dataset.view;
      if(el.dataset.view==='calendar') state.anchor=new Date();
      if(el.dataset.view==='tasks'){ state.filter.status='todas'; state.filter.tag='todas'; }
      render(); break;
    case 'new': openModal(null,null); break;
    case 'new-day': openModal(null, el.dataset.day); break;
    case 'edit': openModal(task()); break;
    case 'cancel': closeModal(); break;
    case 'save': saveTask(); break;
    case 'pick': { readForm(); const k=el.dataset.k, v=el.dataset.v; state.form[k]=(k==='priority'&&state.form[k]===v)?'none':v; renderModal(); break; }
    case 'toggle': { const t=task(); const prev=t.status; t.status=t.status==='hecha'?'pendiente':'hecha'; logChange(t,'Estado: '+ST[t.status][0]); t.doneAt=t.status==='hecha'?t0:null; persistTask(t); render(); showUndo(t.status==='hecha'?'Tarea completada':'Tarea reabierta', ()=>{t.status=prev; persistTask(t);}); break; }

function timeGrid(key,list,opt){
  const scale=opt.scale||1, maxCols=opt.maxCols||99, labels=opt.labels!==false;
  const hm=x=>parseInt(x.slice(0,2),10)*60+parseInt(x.slice(3,5),10);
  const START=7*60, END=23*60, H=(END-START)*scale;
  const items=list.filter(t=>t.due_time).map(t=>{
    let s0=hm(t.due_time); let e0=t.end_time?hm(t.end_time):s0+60;
    s0=Math.max(START,Math.min(END-15,s0)); if(e0<=s0) e0=s0+30; e0=Math.min(END,e0);
    return {t,s:s0,e:e0,col:0};
  }).sort((x,y)=>x.s-y.s||y.e-x.e);
  const colEnds=[];
  items.forEach(it=>{ let c=colEnds.findIndex(x=>x<=it.s); if(c<0){ c=colEnds.length; colEnds.push(it.e); } else colEnds[c]=it.e; it.col=c; });
  const n=Math.min(maxCols,Math.max(1,colEnds.length));
  let hours=''; for(let h=7;h<=22;h++){ hours+=`<div class="hl" style="top:${(h*60-START)*scale}px">${labels?`<span>${String(h).padStart(2,'0')}:00</span>`:''}</div>`; }
  let evs='', chips='';
  items.forEach(it=>{
    const top=(it.s-START)*scale, hgt=Math.max(labels?30:22,(it.e-it.s)*scale-3);
    if(it.col>=maxCols){ chips+=`<button type="button" class="more-chip" data-act="more-day" data-day="${key}" style="top:${top+2}px">+1</button>`; return; }
    evs+=pill(it.t).replace('style="--c:',`style="position:absolute;top:${top}px;height:${hgt}px;left:calc(${it.col*100/n}% + 3px);width:calc(${100/n}% - 6px);--c:`);
  });
  const nowM=new Date().getHours()*60+new Date().getMinutes();
  const nowLine=(key===t0&&nowM>=START&&nowM<=END)?`<div class="now-line" style="top:${(nowM-START)*scale}px"></div>`:'';
  return `<div class="day-grid${labels?'':' nolabel'}" data-day="${key}" data-grid="1" data-scale="${scale}" style="height:${H}px">${hours}<div class="day-events">${evs}</div>${chips}${nowLine}</div>`;
}

  if(categoryRows.length) setCategories(categoryRows);
}
function catDraftHTML(){
  const d=state.catDraft; if(!d) return '';
  return `<div class="cat-draft">
    <label for="cat-name" style="display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:7px">${d.id?'Editar etiqueta':'Nueva etiqueta'}</label>
    <input id="cat-name" type="text" maxlength="24" placeholder="Por ejemplo: Gym, Exámenes, Presentaciones" value="${esc(d.name)}">
    <div class="cat-colors">${CAT_PALETTE.map(c=>`<button type="button" class="cat-sw ${d.color===c?'on':''}" style="--c:${c}" data-act="cat-color" data-c="${c}" aria-label="Elegir color"></button>`).join('')}</div>
    <div class="cat-actions">
      ${d.id?'<button type="button" class="txt del" data-act="cat-del">Eliminar</button>':''}
      <button type="button" class="btn secondary sm" data-act="cat-cancel">Cancelar</button>
      <button type="button" class="btn primary sm" data-act="cat-save">Guardar etiqueta</button>
    </div>
  </div>`;
}
async function persistCategories(rows){
  try{
    for(const row of rows) await putEncryptedRecord('category',row.id,{key:row.key,name:row.name,color:row.color});
    return true;
  }catch(error){console.error(error);toast('No se pudo guardar la etiqueta: '+error.message);return false;}
}
document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='cat-add'){ state.catDraft={id:null,key:null,name:'',color:CAT_PALETTE[0]}; renderModal(); return; }
  if(a==='cat-edit'){ const r=categoryRows.find(x=>x.key===state.form.tag); if(r){ state.catDraft={id:r.id,key:r.key,name:r.name,color:r.color}; renderModal(); } return; }
  if(a==='cat-color'){ const cn=$('#cat-name'); if(cn) state.catDraft.name=cn.value; state.catDraft.color=el.dataset.c; renderModal(); return; }
  if(a==='cat-cancel'){ state.catDraft=null; renderModal(); return; }
  if(a==='cat-save'){
    const d=state.catDraft; const name=($('#cat-name')?.value||'').trim();
    if(!name){ $('#cat-name')?.focus(); toast('Escribe un nombre para la etiqueta'); return; }
    if(d.id){
      const r=categoryRows.find(x=>x.id===d.id);
      if(!r) return;
      r.name=name; r.color=d.color;
      if(!await persistCategories([{id:r.id,user_id:currentUser.id,key:r.key,name,color:d.color}])) return;
      setCategories(categoryRows); state.catDraft=null; render(); renderModal(); toast('Etiqueta actualizada');
    } else {
      const row={id:crypto.randomUUID(),user_id:currentUser.id,key:slugKey(name),name,color:d.color};
      if(!await persistCategories([row])) return;
      categoryRows.push(row); setCategories(categoryRows);
      state.form.tag=row.key; state.catDraft=null; render(); renderModal(); toast('Etiqueta creada');
    }
    return;
  }
  if(a==='cat-del'){
    const d=state.catDraft; if(!d||!d.id) return;
    const uses=state.tasks.filter(t=>t.tag===d.key).length;
    if(uses){ toast(`Esta etiqueta tiene ${uses} tarea${uses===1?'':'s'}. Cámbialas antes de borrarla.`); return; }
    if(categoryRows.length<=1){ toast('Debe quedar al menos una etiqueta'); return; }
    try{await deleteEncryptedRecord('category',d.id);}
    catch(error){toast('No se pudo borrar: '+error.message);return;}
    categoryRows=categoryRows.filter(x=>x.id!==d.id); setCategories(categoryRows);
    if(state.form.tag===d.key) state.form.tag=categoryRows[0].key;
    state.catDraft=null; render(); renderModal(); toast('Etiqueta eliminada');
  }
});

/* ---- Repeticiones: crear las siguientes ocurrencias ---- */
let _preLen=0, _preNew=false;
document.addEventListener('click', e=>{
  if(e.target.closest('[data-act="save"]')){ _preLen=state.tasks.length; _preNew=!state.editing; }
}, true);
document.addEventListener('click', e=>{
  if(!e.target.closest('[data-act="save"]')) return;
  if(!_preNew || state.tasks.length<=_preLen) return;
  const base=state.tasks[state.tasks.length-1];
  if(!base.repeat || base.repeat==='none') return;
  const total=12;
  const sid=crypto.randomUUID(); base.series_id=sid; persistTask(base);
  for(let i=1;i<total;i++){
    const d=pd(base.due_date);
    const nd = base.repeat==='weekly' ? addDays(d,7*i) : new Date(d.getFullYear(), d.getMonth()+i, d.getDate(), 12);
    const t={...base, id:crypto.randomUUID(), due_date:iso(nd), subtasks:(base.subtasks||[]).map(x=>({...x})), history:[], doneAt:null};
    logChange(t,'Creada como repetición');
    state.tasks.push(t); persistTask(t);
  }
  render();
  toast(`Serie creada: ${total} tareas`);
});

/* ---- Borrar una tarea repetida: solo esta o toda la serie ---- */
function deleteOne(id){
  const idx=state.tasks.findIndex(x=>x.id===id); if(idx<0) return;
  const removed=state.tasks[idx];
  state.tasks.splice(idx,1); removeTaskFromDB(id);
  closeModal(); render();
  showUndo('Tarea eliminada', ()=>{ state.tasks.splice(idx,0,removed); persistTask(removed); });
}
async function deleteSeries(sid,n){
  const removed=state.tasks.filter(x=>x.series_id===sid);
  const ids=removed.map(x=>x.id);
  state.tasks=state.tasks.filter(x=>x.series_id!==sid);
  try{for(const id of ids) await deleteEncryptedRecord('task',id);}
  catch(error){toast('No se pudo borrar toda la serie: '+error.message);return;}
  closeModal(); render();
  showUndo(`Serie eliminada (${n} tareas)`, ()=>{ removed.forEach(x=>{ state.tasks.push(x); persistTask(x); }); });
}
function askSeriesDelete(t,n){
  const w=document.createElement('div'); w.className='ov open'; w.id='series-ask';
  w.innerHTML=`<div class="modal sa-box">
    <h2>Eliminar tarea repetida</h2>
    <div class="sub">«${esc(t.title)}» se repite ${n} veces. ¿Qué quieres borrar?</div>
    <div class="sa-actions">
      <button class="btn secondary" data-sa="cancel">Cancelar</button>
      <button class="btn secondary" data-sa="one">Solo esta</button>
      <button class="btn danger-solid" data-sa="all">Toda la serie</button>
    </div></div>`;
  document.body.appendChild(w);
  w.addEventListener('click', ev=>{
    if(ev.target===w){ w.remove(); return; }
    const b=ev.target.closest('[data-sa]'); if(!b) return;
    const a=b.dataset.sa; w.remove();
    if(a==='one') deleteOne(t.id);
    if(a==='all') deleteSeries(t.series_id,n);
  });
}
document.addEventListener('click', e=>{
  const del=e.target.closest('[data-act="delete"]'); if(!del) return;
  const t=state.tasks.find(x=>x.id===del.dataset.id);
  if(!t||!t.series_id) return;
  const n=state.tasks.filter(x=>x.series_id===t.series_id).length;
  if(n<2) return;
  e.stopImmediatePropagation(); e.preventDefault();
  askSeriesDelete(t,n);
}, true);

/* ---- Editar toda la serie ---- */
function askSeriesEdit(n, onOne, onAll){
  const w=document.createElement('div'); w.className='ov open'; w.id='series-ask';
  w.innerHTML=`<div class="modal sa-box">
    <h2>Editar tarea repetida</h2>
    <div class="sub">Esta tarea se repite ${n} veces. ¿Quieres cambiar solo esta o toda la serie?</div>
    <div class="sa-actions">
      <button class="btn secondary" data-sa="cancel">Cancelar</button>
      <button class="btn secondary" data-sa="one">Solo esta</button>
      <button class="btn primary" data-sa="all">Toda la serie</button>
    </div></div>`;
  document.body.appendChild(w);
  w.addEventListener('click', ev=>{
    if(ev.target===w){ w.remove(); return; }
    const b=ev.target.closest('[data-sa]'); if(!b) return;
    const a=b.dataset.sa; w.remove();
    if(a==='one') onOne();
    if(a==='all') onAll();
  });
}
function applySeriesEdit(t,n){
  readForm(); const f=state.form;
  if(!f.title.trim()){ toast('Escribe un título'); return; }
  const fields={title:f.title.trim(), description:(f.description||'').trim(), due_time:f.due_time||null, end_time:f.end_time||null, tag:f.tag, priority:f.priority};
  const sid=t.series_id;
  state.tasks.filter(x=>x.series_id===sid).forEach(x=>{ Object.assign(x,fields); logChange(x,'Serie editada'); persistTask(x); });
  closeModal(); render(); toast(`Serie actualizada (${n} tareas)`);
}
document.addEventListener('click', e=>{
  const sv=e.target.closest('[data-act="save"]'); if(!sv) return;
  if(!state.editing) return;
  const t=state.tasks.find(x=>x.id===state.editing);
  if(!t||!t.series_id) return;
  const n=state.tasks.filter(x=>x.series_id===t.series_id).length;
  if(n<2) return;
  e.stopImmediatePropagation(); e.preventDefault();
  askSeriesEdit(n, ()=>saveTask(), ()=>applySeriesEdit(t,n));
}, true);

/* ---- Duplicar tarea ---- */
function duplicateTask(id){
  const src=state.tasks.find(x=>x.id===id); if(!src) return;
  const copy={...src, id:crypto.randomUUID(), series_id:null, due_date:iso(addDays(pd(src.due_date),1)), subtasks:(src.subtasks||[]).map(x=>({...x})), history:[], doneAt:null};
  logChange(copy,'Duplicada desde «'+src.title+'»');
  state.tasks.push(copy); persistTask(copy);
  render(); openModal(copy);
  toast('Duplicada para mañana. Cambia la fecha si quieres');
}
document.addEventListener('click', e=>{
  const d=e.target.closest('[data-act="dup"]'); if(!d) return;
  duplicateTask(d.dataset.id);
});

render();
/* ---- Mostrar / ocultar la barra lateral ---- */
(function(){
  const app=document.querySelector('.app'), aside=document.querySelector('.app > aside');
  if(!app||!aside) return;
  const btn=document.createElement('button');
  btn.type='button'; btn.className='sb-btn';
  btn.innerHTML='<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>';
  function place(closed){
    if(closed){ btn.className='sb-btn floating'; btn.title='Mostrar barra lateral'; btn.setAttribute('aria-label','Mostrar barra lateral'); document.body.appendChild(btn); }
    else { btn.className='sb-btn in-aside'; btn.title='Ocultar barra lateral'; btn.setAttribute('aria-label','Ocultar barra lateral'); aside.appendChild(btn); }
  }
  function setClosed(c){
    app.classList.toggle('sb-closed',c);
    place(c);
    try{ localStorage.setItem('tempo-sidebar', c?'closed':'open'); }catch(e){}
  }
  btn.addEventListener('click',()=>setClosed(!app.classList.contains('sb-closed')));
  let closed=false; try{ closed=localStorage.getItem('tempo-sidebar')==='closed'; }catch(e){}
  setClosed(closed);
})();

/* ---- Inicio de sesión con Google ---- */
async function handleOAuthHash(){
  const h=location.hash; if(!h||h.indexOf('access_token=')<0) return;
  const p=new URLSearchParams(h.slice(1)); const at=p.get('access_token'); if(!at) return;
  try{
    const r=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+at}});
    const user=await r.json();
    const ttl=Number(p.get('expires_in')||3600);
    localStorage.setItem('tempo-supabase-session',JSON.stringify({access_token:at,refresh_token:p.get('refresh_token'),token_type:'bearer',expires_in:ttl,expires_at:Math.floor(Date.now()/1000)+ttl,user}));
  }catch(e){}
  history.replaceState(null,'',location.pathname+location.search);
}
(function(){
  const g=document.getElementById('auth-google'); if(!g) return;
  g.addEventListener('click',()=>{
    const back=location.origin+location.pathname;
    location.href=SUPABASE_URL+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(back);
  });
})();
/* ---- Recuperar contraseña ---- */
(function(){
  const b=document.getElementById('auth-forgot'); if(!b) return;
  b.addEventListener('click', async ()=>{
    const emailEl=document.getElementById('auth-email');
    const email=(emailEl.value||'').trim();
    if(!email){ authMessage('Escribe tu correo para enviarte el enlace.',true); emailEl.focus(); return; }
    if(!supabase){ authMessage('Conectando con Supabase…',true); return; }
    b.disabled=true;
    const {error}=await supabase.auth.resetPasswordForEmail(email);
    b.disabled=false;
    if(error) authMessage(error.message||'No se pudo enviar el correo.',true);
    else authMessage('Te hemos enviado un correo con el enlace para restablecer la contraseña.');
  });
})();

/* ---- Diálogo de confirmación dentro de la app ---- */
function askDialog(title,msg,okLabel){
  return new Promise(resolve=>{
    const w=document.createElement('div'); w.className='ov open'; w.id='dlg-ask';
    w.innerHTML=`<div class="modal sa-box"><h2>${esc(title)}</h2><div class="sub">${esc(msg)}</div><div class="sa-actions"><button class="btn secondary" data-dl="no">Cancelar</button><button class="btn primary" data-dl="yes">${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(w);
    w.addEventListener('click', ev=>{
      if(ev.target===w){ w.remove(); resolve(false); return; }
      const b=ev.target.closest('[data-dl]'); if(!b) return;
      w.remove(); resolve(b.dataset.dl==='yes');
    });
  });
}
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act="logout"]'); if(!b) return;
  e.stopImmediatePropagation(); e.preventDefault();
  const ok=await askDialog('Cerrar sesión','¿Seguro que quieres cerrar sesión? Tus datos seguirán guardados en tu cuenta.','Cerrar sesión');
  if(ok) signOutTempo();
}, true);
